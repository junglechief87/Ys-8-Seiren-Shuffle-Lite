name: Update patch timestamp

on:
  push:
    paths:
      - 'script/**'
      - 'inc/**'
      - 'text/en/**'
      - 'text/stage/**'

permissions:
  contents: write

jobs:
  bump-timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Write timestamp file and commit
        run: |
          mkdir -p patch
          echo "{\"updated_at\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"commit\": \"$GITHUB_SHA\", \"actor\": \"$GITHUB_ACTOR\"}" > patch/last_update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch/last_update.json
          git commit -m "Update patch/last_update.json from workflow" || echo "Nothing to commit"
          git push
